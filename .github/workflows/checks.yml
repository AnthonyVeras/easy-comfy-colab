name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app remote tests scripts
      - run: python -m unittest discover -s tests -p test_v2.py -v
      - run: python -m unittest discover -s tests -p test_portability.py -v
      - run: python scripts/check_public_tree.py
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          find . -path ./.git -prune -o -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
          bash tests/test_ssh_transport.sh
          bash tests/test_cancel_start.sh
