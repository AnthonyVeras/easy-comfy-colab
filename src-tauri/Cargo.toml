[package]
name = "easy-comfy-colab-2"
version = "0.1.0"
description = "Easy Comfy Colab 2 native shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
